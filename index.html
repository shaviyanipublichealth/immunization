<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>0.5ml Syringe Stock Status</title>
  
  <!-- Font Awesome Library -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- html2canvas Library for Image Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --primary-color: #0056b3;
      --primary-hover: #004085;
      --success-color: #28a745;
      --success-hover: #218838;
      --danger-color: #dc3545;
      --danger-hover: #c82333;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --border-color: #ccc;
      --text-color: #333;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      color: var(--text-color);
    }

    .container {
      max-width: 600px;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      margin: auto;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
    }

    select, input[type="text"], input[type="date"], input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      box-sizing: border-box;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .batch-group {
      background: #f9fbfd;
      border: 1px solid #e1e8ed;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 15px;
      position: relative;
    }

    .batch-group h4 {
      margin: 0 0 10px 0;
      color: #444;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-add {
      background-color: var(--success-color);
      color: white;
      width: 100%;
      margin-top: 5px;
    }

    .btn-add:hover {
      background-color: var(--success-hover);
    }

    .btn-submit {
      background-color: var(--primary-color);
      color: white;
      width: 100%;
      margin-top: 20px;
      font-size: 16px;
    }

    .btn-submit:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-submit:disabled {
      background-color: #a0c4ed;
      cursor: not-allowed;
    }

    .remove-btn {
      background: var(--danger-color);
      color: white;
      padding: 4px 8px;
      font-size: 12px;
    }

    .remove-btn:hover {
      background: var(--danger-hover);
    }

    /* Spinner & Modal Overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
      box-sizing: border-box;
    }

    .modal-card {
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      text-align: center;
      max-height: 90vh;
      overflow-y: auto;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--primary-color);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .summary-box {
      background: #fff;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-top: 15px;
      text-align: left;
    }

    .summary-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 13px;
    }

    .summary-table th, .summary-table td {
      border: 1px solid #ddd;
      padding: 6px;
    }

    .summary-table th {
      background-color: #f2f2f2;
      color: #333;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .btn-pdf { background-color: #dc3545; color: white; flex: 1; }
    .btn-pdf:hover { background-color: #c82333; }

    .btn-img { background-color: #17a2b8; color: white; flex: 1; }
    .btn-img:hover { background-color: #138496; }

    .modal-close-btn {
      background-color: #6c757d;
      color: white;
      margin-top: 10px;
      width: 100%;
    }
    .modal-close-btn:hover { background-color: #5a6268; }

    #closed-banner {
      display: none;
      background-color: #fdf2f2;
      border: 2px solid var(--danger-color);
      color: var(--danger-color);
      padding: 30px;
      border-radius: 8px;
      text-align: center;
      margin-top: 20px;
    }

    #closed-banner h3 {
      margin-top: 0;
      font-size: 22px;
    }

    /* Print styles optimization */
    @media print {
      body * { visibility: hidden; }
      #printableSummary, #printableSummary * { visibility: visible; }
      #printableSummary { position: absolute; left: 0; top: 0; width: 100%; border: none; }
      .action-buttons, .modal-close-btn { display: none; }
    }
  </style>
</head>
<body>

<div class="container">
  
  <!-- Embedded Header SVG Image with One-shot Syringe Watermark -->
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="100%" height="auto" style="margin-bottom: 20px; border-radius: 8px;">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0056b3" />
        <stop offset="100%" stop-color="#003366" />
      </linearGradient>
      <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#28a745" />
        <stop offset="100%" stop-color="#1e7e34" />
      </linearGradient>
    </defs>

    <rect width="800" height="180" rx="12" fill="url(#bgGrad)" />

    <g transform="translate(680, 90) scale(1.1)" opacity="0.15" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="30" y1="0" x2="50" y2="0" />
      <rect x="-10" y="-8" width="40" height="16" rx="2" fill="#ffffff" fill-opacity="0.1" />
      <line x1="0" y1="-8" x2="0" y2="-4" />
      <line x1="10" y1="-8" x2="10" y2="-4" />
      <line x1="20" y1="-8" x2="20" y2="-4" />
      <line x1="-30" y1="0" x2="-10" y2="0" stroke-width="6" />
      <path d="M-30,-12 V12" stroke-width="5" />
      <path d="M10,-14 V-8" stroke-width="4" />
      <path d="M10,8 V14" stroke-width="4" />
    </g>

    <rect x="25" y="30" width="8" height="120" rx="4" fill="url(#accentGrad)" />

    <text x="50" y="55" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="22">Shaviyani Atoll Health Facilities</text>
    <text x="50" y="85" fill="#a8dadc" font-family="Arial, sans-serif" font-weight="bold" font-size="16">National Immunization Program</text>
    <text x="50" y="125" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="30" letter-spacing="0.5">0.5ml Syringe Stock Status</text>
  </svg>

  <form id="stockForm" onsubmit="handleFormSubmit(event)">
    
    <label for="hcf"><i class="fa-solid fa-hospital"></i> Health Care Facility (HCF):</label>
    <select name="hcf" id="hcf" required>
      <option value="">-- Select Health Centre --</option>
      <option value="Sh. Kanditheemu HC">Sh. Kanditheemu HC</option>
      <option value="Sh. Noomaraa HC">Sh. Noomaraa HC</option>
      <option value="Sh. Goidhoo HC">Sh. Goidhoo HC</option>
      <option value="Sh. Feydhoo HC">Sh. Feydhoo HC</option>
      <option value="Sh. Feevah HC">Sh. Feevah HC</option>
      <option value="Sh. Bilehfahi HC">Sh. Bilehfahi HC</option>
      <option value="Sh. Foakaidhoo HC">Sh. Foakaidhoo HC</option>
      <option value="Sh. Narudhoo HC">Sh. Narudhoo HC</option>
      <option value="Sh. Maroshi HC">Sh. Maroshi HC</option>
      <option value="Sh. Lhaimagu HC">Sh. Lhaimagu HC</option>
      <option value="Sh. Komandoo HC">Sh. Komandoo HC</option>
      <option value="Sh. Maaungoodhoo HC">Sh. Maaungoodhoo HC</option>
      <option value="Sh. Milandhoo HC">Sh. Milandhoo HC</option>
    </select>

    <div id="batchContainer">
      <div class="batch-group" id="batch-1">
        <h4><i class="fa-solid fa-boxes-stacked"></i> Batch 1</h4>
        
        <label><i class="fa-solid fa-industry"></i> Manufacturer:</label>
        <input type="text" name="manufacturer[]" required placeholder="Enter manufacturer name">

        <label><i class="fa-solid fa-barcode"></i> Batch Number:</label>
        <input type="text" name="batchNumber[]" required placeholder="Enter batch number">
        
        <label><i class="fa-solid fa-calendar-days"></i> Expiry Date:</label>
        <input type="date" name="expiryDate[]" required>
        
        <label><i class="fa-solid fa-cubes"></i> Amount on Hand:</label>
        <input type="number" name="amountOnHand[]" min="0" required placeholder="Enter quantity">
      </div>
    </div>

    <button type="button" class="btn-add" onclick="addBatchField()"><i class="fa-solid fa-plus"></i> Add Another Batch</button>

    <label for="staffInfo"><i class="fa-solid fa-user-nurse"></i> Staff Name & Designation:</label>
    <input type="text" name="staffInfo" id="staffInfo" required placeholder="e.g. Ahmed Shareef, Senior Community Health Officer">

    <label for="reportDate"><i class="fa-solid fa-calendar"></i> Report Date:</label>
    <input type="date" name="reportDate" id="reportDate" required>

    <button type="submit" class="btn-submit" id="submitBtn"><i class="fa-solid fa-paper-plane"></i> Submit Stock Status</button>
  </form>

  <div id="closed-banner">
    <h3><i class="fa-solid fa-ban"></i> Submission Access Closed</h3>
    <p>This stock status submission form is no longer accepting responses. The deadline was <strong>September 20, 2026, at 08:30 AM</strong>.</p>
  </div>

</div>

<!-- Popup Modal Module -->
<div id="statusModal" class="modal-overlay">
  <div class="modal-card">
    <div id="modalSpinner" class="spinner"></div>
    <h3 id="modalTitle">Submitting Stock Status...</h3>
    <p id="modalMessage">Please wait while your data is securely recorded.</p>
    
    <div id="modalSummaryContainer" style="display:none;">
      <div id="printableSummary" class="summary-box">
        <h4 style="margin:0 0 8px 0; color:#0056b3; font-size:15px;"><i class="fa-solid fa-file-medical"></i> Stock Submission Record</h4>
        <div style="font-size: 12px; line-height: 1.5;">
          <strong>Facility:</strong> <span id="sumHcf"></span><br>
          <strong>Staff:</strong> <span id="sumStaff"></span><br>
          <strong>Report Date:</strong> <span id="sumDate"></span>
        </div>
        <div id="sumTableContainer"></div>
      </div>

      <div class="action-buttons">
        <button type="button" class="btn-pdf" onclick="saveAsPDF()"><i class="fa-solid fa-file-pdf"></i> Save PDF</button>
        <button type="button" class="btn-img" onclick="saveAsImage()"><i class="fa-solid fa-file-image"></i> Save Image</button>
      </div>
    </div>

    <button type="button" id="modalCloseBtn" class="modal-close-btn" style="display:none;" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
  let batchCount = 1;
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwM9_abjlUb0WEsjLwe2FPn6AJdNhaJDDXLaObtQS45h4CQ8XYF0qq2pnc2cBdgxbox3A/exec";

  let lastSubmission = { hcf: '', reportDate: '' };

  window.addEventListener('DOMContentLoaded', () => {
    const closingTime = new Date("2026-09-20T08:30:00");
    const currentTime = new Date();

    if (currentTime > closingTime) {
      document.getElementById('stockForm').style.display = 'none';
      document.getElementById('closed-banner').style.display = 'block';
    }
  });

  function addBatchField() {
    batchCount++;
    const container = document.getElementById('batchContainer');
    const div = document.createElement('div');
    div.classList.add('batch-group');
    div.id = `batch-${batchCount}`;
    div.innerHTML = `
      <h4>
        <span><i class="fa-solid fa-boxes-stacked"></i> Batch ${batchCount}</span>
        <button type="button" class="remove-btn" onclick="removeBatch(${batchCount})"><i class="fa-solid fa-trash"></i> Remove</button>
      </h4>
      
      <label><i class="fa-solid fa-industry"></i> Manufacturer:</label>
      <input type="text" name="manufacturer[]" required placeholder="Enter manufacturer name">

      <label><i class="fa-solid fa-barcode"></i> Batch Number:</label>
      <input type="text" name="batchNumber[]" required placeholder="Enter batch number">
      
      <label><i class="fa-solid fa-calendar-days"></i> Expiry Date:</label>
      <input type="date" name="expiryDate[]" required>
      
      <label><i class="fa-solid fa-cubes"></i> Amount on Hand:</label>
      <input type="number" name="amountOnHand[]" min="0" required placeholder="Enter quantity">
    `;
    container.appendChild(div);
  }

  function removeBatch(id) {
    const element = document.getElementById(`batch-${id}`);
    if (element) {
      element.remove();
    }
  }

  function closeModal() {
    window.location.href = "https://shaviyanipublichealth.blogspot.com/";
  }

  function saveAsPDF() {
    window.print();
  }

  function saveAsImage() {
    const element = document.getElementById('printableSummary');
    const safeHcf = lastSubmission.hcf.replace(/[^a-zA-Z0-9]/g, '_');
    const filename = `${safeHcf}_Stock_Report_${lastSubmission.reportDate}.png`;

    html2canvas(element, { scale: 2 }).then(canvas => {
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  }

  function handleFormSubmit(event) {
    event.preventDefault();
    
    const closingTime = new Date("2026-09-20T08:30:00");
    const currentTime = new Date();

    if (currentTime > closingTime) {
      document.getElementById('stockForm').style.display = 'none';
      document.getElementById('closed-banner').style.display = 'block';
      return;
    }

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Submitting...';

    const modal = document.getElementById('statusModal');
    const spinner = document.getElementById('modalSpinner');
    const modalTitle = document.getElementById('modalTitle');
    const modalMessage = document.getElementById('modalMessage');
    const summaryContainer = document.getElementById('modalSummaryContainer');
    const closeBtn = document.getElementById('modalCloseBtn');

    spinner.style.display = 'block';
    modalTitle.textContent = 'Submitting Stock Status...';
    modalMessage.textContent = 'Please wait while records are sent to the system.';
    summaryContainer.style.display = 'none';
    closeBtn.style.display = 'none';
    modal.style.display = 'flex';

    const formElement = document.getElementById('stockForm');
    const formData = new FormData(formElement);
    
    const data = {
      hcf: formData.get('hcf'),
      manufacturer: formData.getAll('manufacturer[]'),
      batchNumber: formData.getAll('batchNumber[]'),
      expiryDate: formData.getAll('expiryDate[]'),
      amountOnHand: formData.getAll('amountOnHand[]'),
      staffInfo: formData.get('staffInfo'),
      reportDate: formData.get('reportDate')
    };

    lastSubmission.hcf = data.hcf;
    lastSubmission.reportDate = data.reportDate;

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(data)
    })
    .then(() => {
      spinner.style.display = 'none';
      modalTitle.innerHTML = '<i class="fa-solid fa-circle-check" style="color:var(--success-color);"></i> Submission Successful!';
      modalMessage.innerHTML = `Stock status for <strong>${data.hcf}</strong> has been successfully recorded.`;

      document.getElementById('sumHcf').textContent = data.hcf;
      document.getElementById('sumStaff').textContent = data.staffInfo;
      document.getElementById('sumDate').textContent = data.reportDate;

      let tableHTML = `
        <table class="summary-table">
          <thead>
            <tr>
              <th>Manufacturer</th>
              <th>Batch #</th>
              <th>Expiry</th>
              <th>Qty</th>
            </tr>
          </thead>
          <tbody>
      `;

      for (let i = 0; i < data.batchNumber.length; i++) {
        tableHTML += `
          <tr>
            <td>${data.manufacturer[i]}</td>
            <td>${data.batchNumber[i]}</td>
            <td>${data.expiryDate[i]}</td>
            <td>${data.amountOnHand[i]}</td>
          </tr>
        `;
      }
      tableHTML += `</tbody></table>`;

      document.getElementById('sumTableContainer').innerHTML = tableHTML;
      summaryContainer.style.display = 'block';
      closeBtn.style.display = 'block';
    })
    .catch((error) => {
      console.error('Error:', error);
      spinner.style.display = 'none';
      modalTitle.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color:var(--danger-color);"></i> Submission Failed';
      modalMessage.textContent = 'There was a network error connecting to the server. Please try again.';
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Submit Stock Status';
      closeBtn.style.display = 'block';
      closeBtn.onclick = () => { modal.style.display = 'none'; };
    });
  }
</script>

</body>
</html>
